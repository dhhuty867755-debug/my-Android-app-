syntax = "proto3";

package iris.speech;

option java_package = "com.x201harsh.IRISMX.proto";
option java_multiple_files = true;

enum AudioFormat {
  PCM_16BIT_44100HZ = 0;
  PCM_FLOAT_48000HZ = 1;
  OPUS_STREAM_16KBPS = 2;
}

enum VoiceNodeStatus {
  STANDBY = 0;
  LISTENING_WAKE_WORD = 1;
  STREAMING_ASR = 2;
  INTENT_EVALUATION = 3;
  TTS_SYNTHESIZING = 4;
}

message AudioFrameHeader {
  uint64 sequence_number = 1;
  uint64 timestamp_nanos = 2;
  AudioFormat format = 3;
  uint32 sample_rate = 4;
  uint32 channels = 5;
}

message SpeechFrame {
  AudioFrameHeader header = 1;
  bytes raw_pcm_data = 2;
  float peak_amplitude = 3;
  float rms_energy = 4;
  bool vad_active = 5;
}

message NeuralIntentEvent {
  string intent_name = 1;
  float confidence_score = 2;
  map<string, string> slots = 3;
  repeated float vector_embedding = 4;
  VoiceNodeStatus node_status = 5;
}

message TelemetryEvent {
  double cpu_usage = 1;
  uint64 memory_heap_bytes = 2;
  float inference_latency_ms = 3;
  uint32 render_fps = 4;
}