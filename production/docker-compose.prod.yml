version: '3.8'

services:
  voice-gateway:
    build:
      context: ..
      dockerfile: production/Dockerfile.gateway
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - ENV=production
    restart: always

  intent-router:
    build:
      context: ..
      dockerfile: production/Dockerfile.router
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
    restart: always

  telemetry-aggregator:
    build:
      context: ..
      dockerfile: production/Dockerfile.telemetry
    ports:
      - "9090:9090"
    restart: always

  nginx-proxy:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - voice-gateway
      - intent-router
    restart: always
