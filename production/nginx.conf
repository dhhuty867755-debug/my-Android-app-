user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    upstream voice_gateway {
        server voice-gateway:8088;
    }

    upstream intent_router {
        server intent-router:8089;
    }

    server {
        listen 80;
        server_name api.irisxai.in;

        location /ws/voice-stream {
            proxy_pass http://voice_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location /api/v1/intent/ {
            proxy_pass http://intent_router;
            proxy_set_header Host $host;
        }
    }
}
